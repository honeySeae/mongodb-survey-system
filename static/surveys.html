<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>我的问卷 · 问卷</title>
  <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
  <main class="page">
    <div class="paper">
      <div class="paper-head">
        <div class="head-row">
          <div>
            <h1>我的问卷</h1>
            <div class="desc">创建问卷、编辑题目，发布后把链接发给填写者</div>
          </div>
          <button class="btn" type="button" id="new-btn">＋ 新建问卷</button>
        </div>
      </div>

      <!-- 点击“新建问卷”后才展开 -->
      <form id="new-form" class="new-form" hidden novalidate>
        <div id="new-message"></div>
        <div class="field">
          <label for="title">问卷标题</label>
          <input class="input" id="title" maxlength="100" required>
        </div>
        <div class="field">
          <label for="description">问卷说明（选填）</label>
          <textarea class="input" id="description" rows="2" maxlength="1000"></textarea>
        </div>
        <div class="field" id="policy-group">
          <span class="field-label">提交策略（发布后不能修改）</span>
          <label class="option radio is-checked">
            <input type="radio" name="policy" value="once" checked><span class="mark"></span>
            <span>每人只能填一次 <span class="muted">普通调查</span></span>
          </label>
          <label class="option radio">
            <input type="radio" name="policy" value="latest"><span class="mark"></span>
            <span>可以重填，以最后一次为准 <span class="muted">如报名表</span></span>
          </label>
          <label class="option radio">
            <input type="radio" name="policy" value="all"><span class="mark"></span>
            <span>可多次填写，每次都算 <span class="muted">如每日打卡</span></span>
          </label>
        </div>
        <div class="field" id="anonymous-group">
          <label class="option checkbox">
            <input type="checkbox" id="anonymous"><span class="mark"></span>
            <span>匿名问卷 <span class="muted">统计和答卷中不显示填写人；填写者仍需登录；发布后不能修改</span></span>
          </label>
        </div>
        <div class="field">
          <span class="field-label">截止时间</span>
          <div id="deadline-slot"></div>
        </div>
        <div class="actions">
          <button class="btn" type="submit" id="create-btn">创建并编辑题目</button>
          <button class="btn link muted" type="button" id="cancel-btn">取消</button>
        </div>
      </form>

      <div id="list"><div class="empty">加载中…</div></div>
    </div>
  </main>
  <script type="module" src="/static/js/surveys.js"></script>
</body>
</html>
